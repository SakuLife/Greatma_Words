name: Auto Generate Data-Driven Video

on:
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Target video length in minutes (>=5)"
        required: false
        default: "15"

jobs:
  generate:
    # GitHub-hosted runner - runs on GitHub's servers, no local PC needed
    # Docker is pre-installed, VOICEVOX will start automatically
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '15' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Docker availability
        run: |
          echo "Checking Docker..."
          docker --version
          docker compose version

      - name: Write client_secrets.json
        run: |
          if [ -n "${{ secrets.GOOGLE_CLIENT_SECRETS_JSON_B64 }}" ]; then
            echo -n "${{ secrets.GOOGLE_CLIENT_SECRETS_JSON_B64 }}" | base64 -d > client_secrets.json
          fi

      - name: Write token.json (optional, YouTube refresh token)
        run: |
          if [ -n "${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}" ]; then
            echo -n "${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}" | base64 -d > token.json
          fi

      - name: Write Google token (optional, Drive/Sheets refresh token)
        run: |
          if [ -n "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" ]; then
            echo -n "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" | base64 -d > google_token.json
          fi

      - name: Generate .env from secrets
        run: |
          cat > .env << 'EOF'
          APP_ENV=production
          DEBUG=false

          # AI
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}

          # Image / KIEAI
          USE_KIEAI=true
          KIEAI_API_KEY=${{ secrets.KIEAI_API_KEY }}
          KIEAI_API_URL=https://api.kie.ai/api/v1
          KIEAI_MODEL=google/nano-banana
          USE_THUMBNAIL_GENERATION=true
          SKIP_THUMBNAIL_GENERATION=false
          THUMBNAIL_PROVIDER=nanobanana
          NANOBANANA_API_KEY=${{ secrets.NANOBANANA_API_KEY }}
          NANOBANANA_API_URL=https://api.nanobanana.ai/v1

          # VOICEVOX
          VOICEVOX_API_URL=http://localhost:50021
          VOICEVOX_SPEAKER_ID=13

          # YouTube
          YOUTUBE_CLIENT_SECRETS_FILE=client_secrets.json
          YOUTUBE_OAUTH_SCOPES=https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/youtube.upload
          YOUTUBE_DEFAULT_CATEGORY=22
          YOUTUBE_DEFAULT_PRIVACY=public

          # Google Drive / Sheets
          GOOGLE_CLIENT_SECRETS_FILE=client_secrets.json
          GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SHEETS_ID=${{ secrets.GOOGLE_SHEETS_ID }}

          # Discord
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}

          # Paths
          DATA_DIR=./data
          PROJECTS_DIR=./data/projects
          TEMPLATES_DIR=./data/templates
          DEFAULT_LLM_MODEL=models/gemini-pro-latest
          DEFAULT_SCRIPT_LENGTH=15
          DEFAULT_TEMPERATURE=0.7
          EOF

      - name: Start VOICEVOX with Docker
        run: |
          # Start VOICEVOX with Docker Compose
          docker compose up -d voicevox

          # Wait for API to be ready (max 60 seconds)
          echo "Waiting for VOICEVOX API to be ready..."
          for i in {1..30}; do
            sleep 2
            if curl -s http://localhost:50021/version > /dev/null 2>&1; then
              echo "VOICEVOX API is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - Waiting for API..."
          done
          echo "VOICEVOX API did not become ready within 60 seconds"
          exit 1

      - name: Run data-driven generation
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python generate_data_driven_video.py auto ${{ env.DURATION_MINUTES }}

      - name: Upload artifacts (video & assets)
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            data/projects/*/video/*.mp4
            data/projects/*/images/*
            data/projects/*/metadata.json
          if-no-files-found: warn

      - name: Stop VOICEVOX
        if: always()
        run: |
          docker compose down
