name: Auto Generate Data-Driven Video

on:
  schedule:
    # 毎朝10時（JST）= UTC 1:00
    - cron: '0 1 * * *'
    # 毎晩19時（JST）= UTC 10:00
    - cron: '0 10 * * *'
  workflow_dispatch:
    inputs:
      duration_minutes:
        description: "Target video length in minutes (>=5)"
        required: false
        default: "15"

jobs:
  generate:
    # Self-hosted Linux runner
    runs-on: self-hosted
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
      DURATION_MINUTES: ${{ github.event.inputs.duration_minutes || '15' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system dependencies (fonts)
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-noto-cjk-extra

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Check Docker availability
        run: |
          echo "Checking Docker..."
          docker --version
          docker-compose version || docker compose version

      - name: Write client_secrets.json
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.GOOGLE_CLIENT_SECRETS_JSON_B64 }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_CLIENT_SECRETS_JSON_B64 }}" | tr -d '\n\r' | base64 -d > client_secrets.json || echo "Failed to decode client_secrets, skipping..."
            if [ -f client_secrets.json ]; then
              echo "client_secrets.json size: $(wc -c < client_secrets.json) bytes"
            fi
          fi

      - name: Write token.json (optional, YouTube refresh token)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}" ]; then
            printf '%s' "${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}" | tr -d '\n\r' | base64 -d > token.json 2>/dev/null
            if [ -f token.json ] && [ -s token.json ]; then
              echo "token.json size: $(wc -c < token.json) bytes"
              # JSONとして有効か確認
              if python3 -c "import json; json.load(open('token.json'))" 2>/dev/null; then
                echo "::notice::token.json is valid JSON"
              else
                echo "::error::token.json is not valid JSON - YouTube upload will fail"
                rm -f token.json
              fi
            else
              echo "::warning::token.json is empty or decode failed - YouTube upload will be skipped"
              rm -f token.json
            fi
          else
            echo "::warning::YOUTUBE_TOKEN_JSON_B64 secret is not set - YouTube upload will be skipped"
          fi

      - name: Write Google token (optional, Drive/Sheets refresh token)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" | tr -d '\n\r' | base64 -d > google_token.json 2>/dev/null
            if [ -f google_token.json ] && [ -s google_token.json ]; then
              echo "google_token.json size: $(wc -c < google_token.json) bytes"
              if python3 -c "import json; json.load(open('google_token.json'))" 2>/dev/null; then
                echo "::notice::google_token.json is valid JSON"
                cp google_token.json drive_token.json
                cp google_token.json sheets_token.json
                echo "Copied to drive_token.json and sheets_token.json"
              else
                echo "::error::google_token.json is not valid JSON"
                rm -f google_token.json
              fi
            else
              echo "::warning::google_token.json is empty or decode failed"
              rm -f google_token.json
            fi
          else
            echo "::warning::GOOGLE_TOKEN_JSON_B64 secret is not set"
          fi

      - name: Generate .env from secrets
        run: |
          cat > .env << EOF
          APP_ENV=production
          DEBUG=false
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          USE_KIEAI=true
          KIEAI_API_KEY=${{ secrets.KIEAI_API_KEY }}
          KIEAI_API_URL=https://api.kie.ai/api/v1
          KIEAI_MODEL=google/nano-banana
          USE_THUMBNAIL_GENERATION=true
          SKIP_THUMBNAIL_GENERATION=false
          THUMBNAIL_PROVIDER=nanobanana
          NANOBANANA_API_KEY=${{ secrets.KIEAI_API_KEY }}
          NANOBANANA_API_URL=https://api.kie.ai/api/v1
          VOICEVOX_API_URL=http://localhost:50021
          VOICEVOX_SPEAKER_ID=13
          YOUTUBE_CLIENT_SECRETS_FILE=client_secrets.json
          YOUTUBE_OAUTH_SCOPES=https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/youtube.force-ssl https://www.googleapis.com/auth/yt-analytics.readonly
          YOUTUBE_AUTO_COMMENT=true
          AB_TEST_ENABLED=${{ vars.AB_TEST_ENABLED || 'false' }}
          AB_TEST_ROTATION_DAYS=7
          AB_TEST_MIN_IMPRESSIONS=100
          AB_TEST_MIN_CTR_DIFF=0.5
          YOUTUBE_DEFAULT_CATEGORY=22
          YOUTUBE_DEFAULT_PRIVACY=private
          GOOGLE_CLIENT_SECRETS_FILE=client_secrets.json
          GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SHEETS_ID=${{ secrets.GOOGLE_SHEETS_ID }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          DATA_DIR=./data
          PROJECTS_DIR=./data/projects
          TEMPLATES_DIR=./data/templates
          DEFAULT_LLM_MODEL=models/gemini-pro-latest
          DEFAULT_SCRIPT_LENGTH=15
          DEFAULT_TEMPERATURE=0.7
          EOF
          # Remove leading spaces from .env file
          sed -i 's/^[[:space:]]*//' .env

      - name: Start VOICEVOX with Docker
        run: |
          # Start VOICEVOX with Docker Compose
          docker-compose up -d voicevox

          # Wait for API to be ready (max 60 seconds)
          echo "Waiting for VOICEVOX API to be ready..."
          for i in {1..30}; do
            sleep 2
            if curl -s http://localhost:50021/version > /dev/null 2>&1; then
              echo "VOICEVOX API is ready!"
              exit 0
            fi
            echo "Attempt $i/30 - Waiting for API..."
          done
          echo "VOICEVOX API did not become ready within 60 seconds"
          exit 1

      - name: Update video stats (views, likes, comments)
        id: update_stats
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python update_video_stats.py

      - name: Report stats update failure
        if: steps.update_stats.outcome == 'failure'
        run: |
          echo "::warning::動画統計の更新に失敗しました。token.jsonまたはsheets_token.jsonの有効性を確認してください。"

      - name: Retry pending comments (from previous scheduled videos)
        continue-on-error: true
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python retry_pending_comments.py

      - name: Run data-driven generation
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          # Use auto mode - AI analyzes YouTube data and suggests person/topic
          # Format: python generate_data_driven_video.py auto duration
          python generate_data_driven_video.py auto ${{ env.DURATION_MINUTES }}

      - name: Upload artifacts (video & assets)
        uses: actions/upload-artifact@v4
        with:
          name: generated-video
          path: |
            data/projects/*/video/*.mp4
            data/projects/*/images/*
            data/projects/*/metadata.json
          if-no-files-found: warn

      - name: Stop VOICEVOX
        if: always()
        run: |
          docker-compose down
