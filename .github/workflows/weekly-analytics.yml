name: Weekly YouTube Analytics & A/B Test

on:
  schedule:
    # 毎週月曜 09:00 JST = 日曜 24:00 UTC = 月曜 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode: analytics, ab-test, deep-analysis, strategy, or all"
        required: false
        default: "all"

jobs:
  analytics:
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Write client_secrets.json
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.GOOGLE_CLIENT_SECRETS_JSON_B64 }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_CLIENT_SECRETS_JSON_B64 }}" | tr -d '\n\r' | base64 -d > client_secrets.json || echo "Failed to decode client_secrets, skipping..."
            if [ -f client_secrets.json ]; then
              echo "client_secrets.json size: $(wc -c < client_secrets.json) bytes"
            fi
          fi

      - name: Write token.json (YouTube OAuth token)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}" ]; then
            printf '%s' "${{ secrets.YOUTUBE_TOKEN_JSON_B64 }}" | tr -d '\n\r' | base64 -d > token.json || echo "Failed to decode token.json, skipping..."
            if [ -f token.json ]; then
              echo "token.json size: $(wc -c < token.json) bytes"
            fi
          fi

      - name: Write Google token (Drive/Sheets OAuth token)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" ]; then
            printf '%s' "${{ secrets.GOOGLE_TOKEN_JSON_B64 }}" | tr -d '\n\r' | base64 -d > google_token.json || echo "Failed to decode google_token, skipping..."
            if [ -f google_token.json ]; then
              echo "google_token.json size: $(wc -c < google_token.json) bytes"
              cp google_token.json drive_token.json
              cp google_token.json sheets_token.json
              echo "Copied to drive_token.json and sheets_token.json"
            fi
          fi

      - name: Generate .env from secrets
        run: |
          cat > .env << EOF
          APP_ENV=production
          DEBUG=false
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY=${{ secrets.GEMINI_API_KEY }}
          USE_KIEAI=true
          KIEAI_API_KEY=${{ secrets.KIEAI_API_KEY }}
          KIEAI_API_URL=https://api.kie.ai/api/v1
          KIEAI_MODEL=google/nano-banana
          USE_THUMBNAIL_GENERATION=true
          SKIP_THUMBNAIL_GENERATION=false
          THUMBNAIL_PROVIDER=nanobanana
          NANOBANANA_API_KEY=${{ secrets.KIEAI_API_KEY }}
          NANOBANANA_API_URL=https://api.kie.ai/api/v1
          YOUTUBE_CLIENT_SECRETS_FILE=client_secrets.json
          YOUTUBE_OAUTH_SCOPES=https://www.googleapis.com/auth/youtube.readonly https://www.googleapis.com/auth/youtube.upload https://www.googleapis.com/auth/yt-analytics.readonly
          YOUTUBE_DEFAULT_CATEGORY=22
          YOUTUBE_DEFAULT_PRIVACY=private
          GOOGLE_CLIENT_SECRETS_FILE=client_secrets.json
          GOOGLE_DRIVE_FOLDER_ID=${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_SHEETS_ID=${{ secrets.GOOGLE_SHEETS_ID }}
          DISCORD_WEBHOOK_URL=${{ secrets.DISCORD_WEBHOOK_URL }}
          DATA_DIR=./data
          PROJECTS_DIR=./data/projects
          TEMPLATES_DIR=./data/templates
          AB_TEST_ENABLED=${{ vars.AB_TEST_ENABLED || 'false' }}
          AB_TEST_ROTATION_DAYS=7
          AB_TEST_MIN_IMPRESSIONS=100
          AB_TEST_MIN_CTR_DIFF=0.5
          EOF
          sed -i 's/^[[:space:]]*//' .env

      - name: Run weekly analytics (basic)
        run: python run_weekly_analytics.py ${{ github.event.inputs.mode || 'all' }}

      - name: Run deep analysis & strategy
        if: github.event.inputs.mode == 'deep-analysis' || github.event.inputs.mode == 'strategy' || github.event.inputs.mode == 'all' || github.event.inputs.mode == ''
        run: python run_deep_analytics.py ${{ github.event.inputs.mode == 'deep-analysis' && 'analysis' || github.event.inputs.mode == 'strategy' && 'strategy' || 'all' }}
